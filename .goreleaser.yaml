# GoReleaser v2 config for Linux, .debs and Docker. Release: push a tag vX.Y.Z (see
# .github/workflows/release.yml); Windows is .goreleaser-windows.yaml (plus setup.exe) and macOS
# .goreleaser-darwin.yaml on a macOS runner, which add their assets to this config's draft release;
# release.yml then publishes it.
# Local dry run: go run github.com/goreleaser/goreleaser/v2@v2.20.3 release --snapshot --clean
version: 2
project_name: pdb-print

builds:
  - id: pdb-print
    main: ./cmd/pdb-print
    binary: pdb-print
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    mod_timestamp: "{{ .CommitTimestamp }}"
  # its own build id so its .deb can depend on poppler-utils (pdftoppm renders there, see render.FindPdftoppm)
  - id: pdb-print-arm
    main: ./cmd/pdb-print
    binary: pdb-print
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [arm]
    goarm: ["6"] # 32-bit ARMv6 runs on every Raspberry Pi (Pi 1, Zero, Pi 2 v1.1 have no 64-bit OS)
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    mod_timestamp: "{{ .CommitTimestamp }}"
  # the usage report collector (docs/telemetry.md), shipped only as an image (dockers_v2 below)
  - id: pdb-print-stats
    main: ./cmd/pdb-print-stats
    binary: pdb-print-stats
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w"]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    ids: [pdb-print, pdb-print-arm]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}
    files: [LICENSE, README.md, config.example.yaml]

checksum:
  name_template: checksums.txt

# Debian packages for scripts/install.sh, which picks pdb-print_<version>_<arch>.deb from
# checksums.txt; nFPM names GOARM=6 "armhf" (Raspberry Pi OS 32-bit). "~" would break the
# checksums on GitHub (pre-release versions), so it becomes "-".
nfpms:
  - &deb
    id: deb
    ids: [pdb-print]
    package_name: pdb-print
    file_name_template: '{{ replace .ConventionalFileName "~" "-" }}'
    formats: [deb]
    homepage: https://github.com/francisrath/pdb-print
    maintainer: Francis Rath <francisrath@users.noreply.github.com>
    description: Direct label printing for Part-DB
    license: MIT
    section: utils
    dependencies: [init-system-helpers] # deb-systemd-helper/-invoke in the maintainer scripts
    contents:
      - src: packaging/deb/pdb-print.service
        dst: /usr/lib/systemd/system/pdb-print.service
    scripts:
      postinstall: packaging/deb/postinst
      preremove: packaging/deb/prerm
      postremove: packaging/deb/postrm
  - <<: *deb
    id: deb-armhf
    ids: [pdb-print-arm]
    dependencies: [init-system-helpers, poppler-utils]

release:
  prerelease: auto # a vX.Y.Z-rc.N tag is a pre-release: never "latest", so the update check skips it
  draft: true # release-windows and release-darwin add their assets, then release-darwin publishes it
  use_existing_draft: true # a re-run reuses this draft (a draft isn't found by its tag)
  replace_existing_artifacts: true # … and overwrites what the first run uploaded
  extra_files:
    - glob: scripts/install.sh

changelog:
  use: github
  filters:
    exclude: ["^docs", "^test", "^ci", "^chore"]

dockers_v2:
  # also under the old name for a few releases, so installs on it (and v0.3.1 and older, whose update
  # notice names it) keep getting updates; drop it from v0.5.0 on
  - images: ["ghcr.io/francisrath/pdb-print", "ghcr.io/francisrath/partdb-print-agent"]
    ids: [pdb-print]
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}" # empty tags are skipped: pre-releases don't move latest
    platforms: [linux/amd64, linux/arm64]
    extra_files: [packaging/docker/config-dir.keep]
    labels:
      org.opencontainers.image.source: https://github.com/francisrath/pdb-print
      org.opencontainers.image.licenses: MIT
      org.opencontainers.image.version: "{{ .Version }}"
  - id: stats
    images: ["ghcr.io/francisrath/pdb-print-stats"]
    ids: [pdb-print-stats]
    dockerfile: packaging/docker/stats.Dockerfile
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms: [linux/amd64, linux/arm64]
    labels:
      org.opencontainers.image.source: https://github.com/francisrath/pdb-print
      org.opencontainers.image.licenses: MIT
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.description: pdb-print usage report collector (docs/telemetry.md)
