# Niimbot label makers (driver niimbot) over Bluetooth LE. Tried on a printer: B21S (2026-11-23); every other
# model is untested. Source for heads, dpi, density ranges, cover polarity and which
# print task (dialect) each model takes: niimbluelib's model table and print tasks (MIT,
# github.com/MultiMote/niimbluelib) and the printers.niim.blue notes (CC-BY-SA-4.0, facts only).
# All models use GATT service e7810a71-… with one characteristic for writes and notifications. Printers
# advertise "<model>-<serial>" (e.g. D110-G326030306); the exact suffix is not documented.
# Rows run across the head: wide models (B1, B21) take labels across, narrow ones (D11, D110) lengthwise,
# so a 40×12 mm D11 label is media 12 mm wide and 40 mm long. density_max: 5 or 3 (the middle is the
# default); lid_inverted: the heartbeat says 1 for a closed cover. ble_gap_ms only paces a packet split
# into several writes; the driver waits 10 ms between packets itself.
# B1 carries the fields every model shares (anchor); the others override what differs.
models:
  - &niimbot
    id: B1
    vendor: Niimbot
    driver: niimbot
    dialect: b1
    dpi: 203
    head_pins: 384
    transports: [ble]
    match: {ble_name: "^B1-"}
    quirks: {ble_service: "e7810a71-73ae-499d-8c15-faa9aef0c3f2", ble_write: "bef8d6c9-9c21-4c9e-b632-bd58c1009f9f",
      ble_notify: "bef8d6c9-9c21-4c9e-b632-bd58c1009f9f", ble_gap_ms: 10, density_max: 5, darkness: true, needs_status: true}
    media: [niimbot-50x30, niimbot-50x20, niimbot-50x50, niimbot-50x70, niimbot-50x80, niimbot-40x30,
      niimbot-40x20, niimbot-30x20, niimbot-30x15, niimbot-25x15]
  - {<<: *niimbot, id: B21, dialect: b21, match: {ble_name: "^B21-"}}
  # tested 2026-11-23 (hardware 40.10, firmware 40.27): niimbluelib's D110 task printed a blank label as the
  # first job on each connection (as niimblue #108 saw on a D101); the B1 task prints at once. Its USB-C port
  # is a USB serial device (macOS /dev/cu.usbmodem…, Linux /dev/ttyACM…) speaking the same packets: tested on macOS
  - {<<: *niimbot, id: B21S, dialect: b1, transports: [ble, serial], match: {ble_name: "^B21S-"}, tested: maintainer,
    tested_note: "Bluetooth LE on a Raspberry Pi and USB serial on macOS, 2026-11 (firmware 40.27)"}
  # 300 dpi; niimbluelib's table says 591 (B21 Pro) and 567 (B1 Pro) dots, the wiki 576 read from the printers.
  # The advertised name is a guess.
  - {<<: *niimbot, id: B21-PRO, dialect: v4, dpi: 300, head_pins: 576, match: {ble_name: "(?i)^B21[ _-]?PRO-"}}
  - {<<: *niimbot, id: B1-PRO, dialect: v4, dpi: 300, head_pins: 576, match: {ble_name: "(?i)^B1[ _-]?PRO-"}}
  - &narrow
    <<: *niimbot
    id: D11
    dialect: d11
    head_pins: 96
    match: {ble_name: "^D11-"}
    quirks: {ble_service: "e7810a71-73ae-499d-8c15-faa9aef0c3f2", ble_write: "bef8d6c9-9c21-4c9e-b632-bd58c1009f9f",
      ble_notify: "bef8d6c9-9c21-4c9e-b632-bd58c1009f9f", ble_gap_ms: 10, density_max: 3, lid_inverted: true,
      darkness: true, needs_status: true}
    media: [niimbot-12x40, niimbot-12x22, niimbot-12x30, niimbot-12x75, niimbot-12x109, niimbot-14x22,
      niimbot-14x30, niimbot-14x60, niimbot-15x30, niimbot-15x50]
  - {<<: *narrow, id: D11S, match: {ble_name: "^D11S-"}}
  - {<<: *narrow, id: D110, dialect: d110, match: {ble_name: "^D110-"}}
  # niimbluelib names no print task for the B18; d110 is the one the other 96-dot models of its age take.
  - {<<: *narrow, id: B18, dialect: d110, match: {ble_name: "^B18-"}}
  # 192 dots (24 mm); takes the narrow rolls until wider D101 sizes are sourced.
  - {<<: *narrow, id: D101, dialect: b1, head_pins: 192, match: {ble_name: "^D101-"}}
  # 300 dpi, 144 dots (the wiki, read from a printer; niimbluelib's table says 142), density 1–5.
  - {<<: *narrow, id: D11-H, dialect: v4, dpi: 300, head_pins: 144, match: {ble_name: "(?i)^D11[ _-]?H-"},
    quirks: {ble_service: "e7810a71-73ae-499d-8c15-faa9aef0c3f2", ble_write: "bef8d6c9-9c21-4c9e-b632-bd58c1009f9f",
      ble_notify: "bef8d6c9-9c21-4c9e-b632-bd58c1009f9f", ble_gap_ms: 10, density_max: 5, darkness: true, needs_status: true}}

