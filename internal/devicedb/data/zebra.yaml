# Zebra ZPL printers (driver zpl). Sources: Zebra spec sheets/user guides and the ZPL II Programming
# Guide P1134473-11EN; USB product ids from linux-usb.org usb.ids (vendor 0a5f) – listed only where
# usb.ids has them. Models are recognised by their ~HI reply ("GK420d-200dpi,V61.17.11Z,8,…"): hi_model
# matches the model part, the dots/mm field picks 203 or 300 dpi. The label size is the loaded roll
# (media-labels.yaml); see ~/Notes/claude/partdb-agent-zebra-models.md.
models:
  # GK420d user guide P1129574-01EN
  - id: GK420d
    vendor: Zebra
    driver: zpl
    dialect: zpl
    dpi: 203
    head_pins: 832
    transports: [tcp, usb]
    match: {hi_model: "^GK420d", usb: ["0a5f:0080", "0a5f:0062"]}
    quirks: {needs_status: true} # a silent Zebra is paused, open or out of labels: don't queue blind
    media: [label-100x150, label-100x100, label-100x50, label-102x152, label-102x102, label-102x76, label-102x64, label-102x51, label-102x25, label-76x51, label-76x25, label-57x32, label-51x25, label-38x25, label-32x25, label-25x13]
