# Brother DK rolls for QL printers at 300 dpi. Values from Brother's "Raster Command Reference"
# (QL-800/810W/820NWB; the QL-600/710W/720NW and QL-500…1060N references give the same pins).
# offset_pins = the spec's "right margin" pins; QL labels are rendered at the printable width (no
# width_dots, never trimmed). On the 1296-pin head of the wide QLs (QL-1050/1060N, QL-1100/1110NWB/
# 1115NWB) the rolls sit on other pins: the geometry list below, from "Raster Command Reference
# QL-1100/1110NWB/1115NWB" v1.00 p.19–20, cross-checked with the QL-1050/1060N tables of the older
# reference (where the QL-1100 one doesn't add up to 1296 pins – 62 mm continuous, 62×29 and 62×100 –
# the older reference's 544 + 696 + 56 is used). The 102/103 mm rolls fit the wide head only, so
# their own entries carry its pins. Brother calls the 103.6 mm roll "104 mm" in ESC i z and the
# status (the driver rounds width_mm). Part numbers: Brother's supply pages (DK-2243/2246/1240/1241/1247
# in the Americas). untested: wide rolls added from Brother's references, 2026-11-20.
