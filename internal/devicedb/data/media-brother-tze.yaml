  - {id: tze-18, name: 18 mm tape, kind: continuous, width_mm: 18, width_dots: 256, printable_width_dots: 234, dpi: 360, offset_pins: 75, edge_mm: 0.78}
  - {id: tze-24, name: 24 mm tape, kind: continuous, width_mm: 24, width_dots: 340, printable_width_dots: 320, dpi: 360, offset_pins: 32, edge_mm: 0.71}
