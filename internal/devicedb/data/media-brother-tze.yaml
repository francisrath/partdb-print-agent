# Brother TZe/HG tape at 360 dpi (PT-9500PC). From Brother's "PT-9500PC Command Reference, CBP-RASTER
# Mode": tape and print-area width in dots (p.6), pins the Windows driver prints on (p.11). Labels are
# drawn across the whole tape (width_dots) and the unprintable edges trimmed.
# geometry: the same tapes on the raster-mode P-touch heads (untested: added from the references,
# 2026-11-20). 128 pins at 180 dpi (PT-E550W/P750W/P710BT and PT-H500/P700/E500 "Raster Command
# Reference", page size p.14 and pins p.20): offset_pins = the "pins for right margin". 560 pins at
# 360 dpi (PT-P900/P900W/P950NW/P910BT reference, p.13 and p.20).
