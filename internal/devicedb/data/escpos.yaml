# ESC/POS receipt printers over Bluetooth Classic (SPP) or USB (driver escpos, dialect raster): GS v 0 raster
# bitmaps at 203 dpi. RG-MTP80B (REGO) is recognised by its paired name or, on USB, by its GS I answer (maker
# REGO, model MTP80B; its USB id 0483:5720 is REGO's but also a generic STM32 one). REGO's label model
# RG-MLP80B is said to report the same names: it matches this entry. The generic models are picked by
# hand. feed_lines is the paper fed after a label in dot rows (8 per mm; 144 puts the label past the
# RG-MTP80B's tear bar), confirm_timeout_ms how long to wait for the printer's completion byte;
# needs_status: the RG-MTP80B always answers, so silence means off or stuck (generic ones print blind).
models:
  - &escpos
    id: RG-MTP80B
    vendor: REGO
    driver: escpos
    dialect: raster
    dpi: 203
    head_pins: 576
    transports: [bt, usb]
    match: {bt_name: "^RG-M[LT]P80B", escpos_id: "^REGO MTP80B"}
    quirks: {feed_lines: 144, confirm_timeout_ms: 20000, needs_status: true}
    media: [paper-80, paper-57] # a 57 mm roll sits centred in the holder: the driver centres it
    defaults: {media: paper-80}
    tested: maintainer
    tested_note: "Bluetooth Classic and USB on macOS, 2026-11. Some shops list it as RG-MLP80B. Darkness is the printer's own setting: it ignores ESC/POS density commands. Continuous paper only: set Paper Type to Normal (black-mark labels print in pieces)"
  - {<<: *escpos, id: ESCPOS-80, vendor: Generic, match: {}, media: [paper-80], defaults: {}, quirks: {feed_lines: 144, confirm_timeout_ms: 20000}, tested: "", tested_note: ""}
  - {<<: *escpos, id: ESCPOS-58, vendor: Generic, match: {}, defaults: {}, quirks: {feed_lines: 144, confirm_timeout_ms: 20000}, head_pins: 384, media: [paper-57], tested: "", tested_note: ""}
