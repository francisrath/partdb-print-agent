# GoReleaser v2 config for macOS, run on a macOS runner after .goreleaser.yaml (see
# .github/workflows/release.yml): universal pdb-print (no cgo) plus the cgo Bluetooth helper
# pdb-print-ble next to it, added to the draft release the Linux job made.
# Local dry run: go run github.com/goreleaser/goreleaser/v2@v2.20.3 release --snapshot --clean --config .goreleaser-darwin.yaml --skip=homebrew
version: 2
project_name: pdb-print

builds:
  - id: pdb-print-darwin
    main: ./cmd/pdb-print
    binary: pdb-print
    env: [CGO_ENABLED=0]
    goos: [darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    mod_timestamp: "{{ .CommitTimestamp }}"
  # the Bluetooth library needs cgo on macOS; the embedded Info.plist carries the Bluetooth
  # usage text, so only this helper asks for Bluetooth permission (see cmd/pdb-print-ble)
  - id: pdb-print-ble
    main: ./cmd/pdb-print-ble
    binary: pdb-print-ble
    dir: . # the linker resolves the -sectcreate path from here
    env: [CGO_ENABLED=1]
    goos: [darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -linkmode=external -extldflags '-sectcreate __TEXT __info_plist cmd/pdb-print-ble/Info.plist'
    mod_timestamp: "{{ .CommitTimestamp }}"

universal_binaries:
  - id: pdb-print-universal
    ids: [pdb-print-darwin]
    name_template: pdb-print
    replace: true
  - id: pdb-print-ble-universal
    ids: [pdb-print-ble]
    name_template: pdb-print-ble
    replace: true

archives:
  - ids: [pdb-print-universal, pdb-print-ble-universal]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_darwin_universal"
    files: [LICENSE, README.md, config.example.yaml]

checksum:
  name_template: checksums-darwin.txt

release:
  draft: true # the workflow publishes it once this job is done
  use_existing_draft: true # the Linux job's draft (a draft isn't found by its tag)
  replace_existing_artifacts: true # a re-run of this job overwrites its own partial uploads
  mode: keep-existing

changelog:
  disable: true

homebrew_casks:
  - name: pdb-print
    binaries: [pdb-print, pdb-print-ble]
    skip_upload: auto # pre-releases don't update the tap
    homepage: https://github.com/francisrath/partdb-print-agent
    description: Direct label printing for Part-DB
    license: MIT
    repository:
      owner: francisrath
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    # ponytail: the binaries aren't signed/notarised yet, so clear the quarantine flag
    # (GoReleaser docs, homebrew_casks); drop this once Developer ID signing is in place.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/pdb-print", "{{ .StagedPath }}/pdb-print-ble"]
          end
