# Copy to the OS config dir (macOS: ~/Library/Application Support/pdb-print/config.yaml,
# Linux: ~/.config/pdb-print/config.yaml, Windows: %AppData%\pdb-print\config.yaml)
# or pass --config FILE.
log_level: info
# Once a day the agent asks GitHub for the latest release (only that request; nothing about this agent
# is sent) and the web UI and log say when a newer one is out. false turns it off.
# update_check: false
# Weekly anonymous usage report (every field: docs/telemetry.md). Unset = not decided yet: nothing is sent
# until the setup wizard's last step or the web UI's "Usage statistics" section records a choice.
# telemetry: true
# Renderer: on 32-bit ARM (Pi 1/2/Zero) the built-in PDFium is slow, so `auto` uses poppler's
# pdftoppm there when it is installed; elsewhere, or if pdftoppm fails, PDFium.
# auto (default) | on (pdftoppm everywhere) | off | /path/to/pdftoppm
# pdftoppm: auto
# `pdb-print discover` finds printers on USB and the network and prints the model and transport
# lines to use. The model (from `pdb-print media`) picks the driver.
printers:
  - id: ql810
    name: Brother QL-810W
    model: QL-810W              # QL-800 (USB only) | QL-810W | QL-820NWB
    transport: {kind: tcp, host: 192.168.1.50, port: 9100}
    # over USB (Linux) instead: {kind: usb, usb_id: "04f9:209c"} – add serial: … to tell two
    # identical printers apart; or a fixed path: {kind: usb, device: /dev/usb/lp0}
    # serial (models with an RS-232 port): {kind: serial, device: /dev/ttyUSB0, baud: 9600, framing: 8N1,
    # flow: none} – flow none | xonxoff | rtscts; Windows: device: COM3
    media: auto                 # the roll the printer reports decides; a media id (dk-22210, see
                                # `pdb-print media`) is a fallback for when it reports none
    # media_allowed: [dk-22210, dk-22214, dk-11204]   # refuse other rolls (default: any the model takes)
    rotate: auto                # auto | 0 | 90 | 180 | 270 (clockwise)
    cut: per_label              # per_label | last | none
    # SNMP (UDP 161, on by default) reports the loaded roll, errors and finished prints.
    # snmp_community: public    # if you changed it in the printer's web settings
    # no_snmp: true             # fall back to the TCP status (network QLs don't answer it)
    # allow_scaling: true       # print labels that don't match the roll by scaling instead of refusing
    # mirror: true              # print flipped left-right (set by the setup wizard's test print)
    # upside_down: true         # turn the print 180°, on top of rotate (likewise)
  # Zebra over the network (ZPL). Zebras don't report the label width: set media to the loaded size.
  # - id: shipping
  #   name: Shipping desk
  #   model: GK420d
  #   transport: {kind: tcp, host: 192.168.1.60}
  #   media: label-102x102
  # Zebra EPL2-only (LP/TLP 2824, 2844, TLP 3842 …; untested). Status and confirmation over USB only.
  # - id: lp2844
  #   model: LP2844
  #   transport: {kind: usb, usb_id: "0a5f:0009"}
  #   media: label-102x51
  #   darkness: normal          # light | normal | dark
  #   black_mark_mm: 4          # black-mark media instead of gaps (0 = gaps)
  # TSC or another TSPL printer (TE200, XP-420B, …). They don't report the label: set media to the loaded roll
  # (label-102x152, continuous-102, …). Over USB (Linux) {kind: usb, device: /dev/usb/lp0}, Bluetooth {kind: bt, address: …}.
  # - id: xprinter
  #   name: Xprinter XP-420B
  #   model: XP-420B
  #   transport: {kind: tcp, host: 192.168.1.70}
  #   media: label-102x152
  #   cut: per_label            # models with a cutter option only: per_label | last | none; unset = the printer's setting
  # Bluetooth LE "cat printer" (GB01-03, GT01, YT01, MX05-MX10; 57 mm paper). `pdb-print discover` prints
  # the transport line. address is a MAC (Linux/Windows) or a CoreBluetooth UUID (macOS); with only
  # name, two printers with the same name are refused. One connection at a time: disconnect phones first.
  # - id: cat
  #   name: Bench MX10
  #   model: MX10
  #   transport: {kind: ble, name: MX10, address: "AA:BB:CC:DD:EE:FF"}
  #   media: paper-57
  #   darkness: normal          # light | normal | dark (darker prints slower)
  # Niimbot (B1, B21, B21S, D11, D110, …) or Phomemo (M02, M110, M220, D30, Q30, …) label maker over
  # Bluetooth LE (B21S tested; the rest untested). Narrow heads take labels lengthwise: a 40×12 mm D11
  # label is niimbot-12x40. A B21S also prints over its USB-C cable, a USB serial port:
  #   transport: {kind: serial, device: /dev/cu.usbmodem1101}   # Linux /dev/ttyACM0, Windows COM3
  # - id: niimbot
  #   name: Desk B21S
  #   model: B21S
  #   transport: {kind: ble, name: B21S-H123456789}
  #   media: niimbot-50x30
  #   darkness: normal          # light | normal | dark (density)
  # Bluetooth Classic ESC/POS printer (RG-MLP80B, ESCPOS-80, ESCPOS-58; 80/58 mm paper). address is the MAC
  # on every OS; channel is optional (Linux: 1 unless set; Windows/macOS look up the SPP service).
  # - id: rego
  #   name: REGO
  #   model: RG-MLP80B
  #   transport: {kind: bt, address: "AA:BB:CC:DD:EE:FF", name: "RG-MLP80B", channel: 1}
  #   media: paper-80           # paper-57 for ESCPOS-58
  # Brother P-touch PT-9500PC over USB (Linux, e.g. a Raspberry Pi; the user needs group `lp`)
  # - id: pt9500
  #   name: Brother PT-9500PC
  #   model: PT-9500PC
  #   transport: {kind: usb, usb_id: "04f9:200f"}
  #   media: auto               # the tape the printer reports; tze-6 … tze-36 = fallback
  #   cut: chain                # default: chain (single labels) / half (batches on laminated tape):
  #                             # the last label waits in the printer until the next print or the
  #                             # cut button, so no blank leader is wasted. per_label: feed and cut
  #                             # at once (wastes ~25 mm per job); none: no cuts
  # DYMO LabelWriter 400/450/4XL (and 330) over USB (Linux usblp, group `lp`). Untested on hardware.
  # DYMOs don't report the loaded labels: set media to the roll's part number (`pdb-print media`).
  # - id: dymo
  #   name: LabelWriter 450
  #   model: LabelWriter-450
  #   transport: {kind: usb, usb_id: "0922:0020"}   # 450 Duo: device: /dev/usb/lpN (label side) instead
  #   media: dymo-99012         # 36×89 mm large address; dymo-11354 57×32 mm, dymo-30252 1⅛×3½" …
  #   darkness: normal          # light | normal | dark

# Print label PDFs downloaded from Part-DB automatically (runs inside `pdb-print serve`).
# Only files younger than 60 s are printed; afterwards they move to printed/ or failed/.
# hot_folder:
#   enabled: true
#   dir: ~/Downloads          # default
#   pattern: label_*.pdf      # Part-DB's download name
#   printer: ql810
