<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest">
  <title>pdb-print – Labelbot</title>
  <!-- shadow -->
  <ellipse cx="250" cy="468" rx="150" ry="16" fill="#000" opacity=".12"/>
  <!-- feet -->
  <rect x="150" y="420" width="60" height="38" rx="18" fill="#1c6f7a"/>
  <rect x="290" y="420" width="60" height="38" rx="18" fill="#1c6f7a"/>
  <!-- arms -->
  <path d="M96 300 q-40 10 -44 -40" fill="none" stroke="#1c6f7a" stroke-width="22" stroke-linecap="round"/>
  <circle cx="52" cy="256" r="16" fill="#1c6f7a"/>
  <!-- body -->
  <rect x="90" y="150" width="320" height="290" rx="70" fill="#2ab0c0"/>
  <rect x="90" y="150" width="320" height="290" rx="70" fill="none" stroke="#17606a" stroke-width="8"/>
  <!-- belly panel -->
  <rect x="130" y="330" width="240" height="80" rx="26" fill="#e9fbfd" opacity=".9"/>
  <circle cx="170" cy="370" r="12" fill="#ff6b5a"/>
  <circle cx="208" cy="370" r="12" fill="#ffd166"/>
  <rect x="240" y="360" width="100" height="20" rx="10" fill="#17606a" opacity=".35"/>
  <!-- antenna -->
  <path d="M250 150 q-10 -50 30 -80" fill="none" stroke="#17606a" stroke-width="8" stroke-linecap="round"/>
  <circle cx="284" cy="66" r="16" fill="#ffd166" stroke="#17606a" stroke-width="6"/>
  <!-- eyes (googly, slightly cross-eyed) -->
  <circle cx="190" cy="215" r="48" fill="#fff" stroke="#17606a" stroke-width="7"/>
  <circle cx="318" cy="210" r="56" fill="#fff" stroke="#17606a" stroke-width="7"/>
  <circle cx="208" cy="225" r="20" fill="#1b1b1b"/>
  <circle cx="300" cy="222" r="24" fill="#1b1b1b"/>
  <circle cx="214" cy="218" r="6" fill="#fff"/>
  <circle cx="308" cy="213" r="7" fill="#fff"/>
  <!-- teeth / tape slot mouth -->
  <rect x="160" y="284" width="190" height="30" rx="15" fill="#17606a"/>
  <rect x="176" y="284" width="18" height="12" rx="3" fill="#fff"/>
  <rect x="316" y="284" width="18" height="12" rx="3" fill="#fff"/>
  <!-- label ribbon: constant width, drawn as a stroked centreline -->
  <path d="M260 298 L260 370 A60 60 0 0 0 320 430 L459 430" fill="none" stroke="#c9b98f" stroke-width="52" stroke-linejoin="round"/>
  <path d="M260 298 L260 370 A60 60 0 0 0 320 430 L456 430" fill="none" stroke="#fffdf5" stroke-width="46" stroke-linejoin="round"/>
  <!-- redacted "words" along the label -->
  <g stroke="#1b1b1b" stroke-linecap="round">
    <line x1="318" y1="417" x2="348" y2="417" stroke-width="6"/>
    <line x1="354" y1="417" x2="372" y2="417" stroke-width="6"/>
    <line x1="378" y1="417" x2="414" y2="417" stroke-width="6"/>
    <line x1="420" y1="417" x2="442" y2="417" stroke-width="6"/>
    <line x1="318" y1="430" x2="334" y2="430" stroke-width="4.5"/>
    <line x1="340" y1="430" x2="374" y2="430" stroke-width="4.5"/>
    <line x1="380" y1="430" x2="404" y2="430" stroke-width="4.5"/>
    <line x1="318" y1="443" x2="344" y2="443" stroke-width="4.5"/>
    <line x1="350" y1="443" x2="364" y2="443" stroke-width="4.5"/>
    <line x1="370" y1="443" x2="400" y2="443" stroke-width="4.5"/>
    <line x1="406" y1="443" x2="424" y2="443" stroke-width="4.5"/>
  </g>
  <!-- right arm waving -->
  <path d="M410 260 q48 -10 56 -60" fill="none" stroke="#1c6f7a" stroke-width="22" stroke-linecap="round"/>
  <circle cx="466" cy="196" r="16" fill="#1c6f7a"/>
  <!-- blush -->
  <ellipse cx="140" cy="280" rx="18" ry="10" fill="#ff6f91" opacity=".85"/>
  <ellipse cx="380" cy="276" rx="18" ry="10" fill="#ff6f91" opacity=".85"/>
</svg>
