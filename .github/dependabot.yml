# Weekly version updates, one grouped PR per ecosystem. Each PR runs the full CI.
# Actions are pinned to commit SHAs (with the version in a comment): Dependabot updates both.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"

  # the distroless base images, pinned by digest (Dockerfile, packaging/docker/stats.Dockerfile)
  - package-ecosystem: docker
    directories: ["/", "/packaging/docker"]
    schedule:
      interval: weekly
    groups:
      docker-base:
        patterns: ["*"]
    commit-message:
      prefix: "chore(docker)"
