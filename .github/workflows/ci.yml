name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # docs-only PRs (docs/, top-level Markdown) skip the jobs below; skipped jobs still let `ci` pass
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR" ]; then echo code=true >>"$GITHUB_OUTPUT"; exit 0; fi
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)')
          if grep -qvE '^docs/|^[^/]+\.md$' <<<"$files"; then echo code=true; else echo code=false; fi >>"$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          # a key of its own (setup-go hashes these files): with go.sum alone it shares lint's and
          # packaging's key, and whichever job saves first leaves the test and race builds out
          cache-dependency-path: |
            go.sum
            go.mod
      - run: go vet ./...
      # Tests never print: printers and Part-DB are faked on localhost.
      - run: go test ./...
        if: matrix.os != 'ubuntu-latest'
      # with the race detector (needs cgo, which Linux runners have): the code shares state between
      # goroutines in many places (printer locks, Bluetooth bridge, usage counters, job loops)
      - name: go test with the race detector
        if: matrix.os == 'ubuntu-latest'
        # render without it: its Go side is a thin wrapper around one PDFium instance, and the race
        # detector only slows wazero compiling PDFium (~3 min for TestCompilationCache's cold compiles);
        # the coverage job and macOS/Windows run render's tests
        run: CGO_ENABLED=1 go test -race $(go list ./... | grep -v /internal/render$)
      # the macOS Bluetooth helper needs cgo (pdb-print itself stays cgo-free, see lint)
      - name: build pdb-print-ble with cgo
        if: matrix.os == 'macos-latest'
        run: CGO_ENABLED=1 go build -o /dev/null ./cmd/pdb-print-ble

  # coverage on its own runner: with the race detector in one run, every test binary was rebuilt with
  # both and the job took twice as long
  coverage:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          # a key of its own, apart from test (ubuntu-latest)'s race builds
          cache-dependency-path: |
            go.sum
            go.mod
            .github/coverage-summary.awk
      - run: |
          go test -coverpkg=./... -coverprofile=coverage.out ./...
          { echo '### Test coverage'; echo; awk -f .github/coverage-summary.awk coverage.out; } >> "$GITHUB_STEP_SUMMARY"

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./... # 2026.2.2
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: goreleaser check
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.3
          args: check .goreleaser.yaml .goreleaser-darwin.yaml .goreleaser-windows.yaml
      - name: cross-compile without cgo
        run: |
          for t in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            CGO_ENABLED=0 GOOS=${t%/*} GOARCH=${t#*/} go build -o /dev/null ./cmd/pdb-print
          done

  packaging:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: shellcheck
        run: shellcheck scripts/*.sh packaging/deb/postinst packaging/deb/prerm packaging/deb/postrm
      - name: install script
        run: sh scripts/install_test.sh
      - name: build packages
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.3
          args: release --snapshot --clean --skip=docker,sign
      - name: check packages
        run: |
          # listings go into variables first: `cmd | grep -q` can kill cmd with SIGPIPE
          for a in amd64 arm64 armhf; do
            deb=$(ls dist/pdb-print_*_"$a".deb)
            grep -q " ${deb#dist/}$" dist/checksums.txt
            files=$(dpkg-deb -c "$deb")
            info=$(dpkg-deb -I "$deb")
            grep -q ' ./usr/bin/pdb-print$' <<<"$files"
            grep -q ' ./usr/lib/systemd/system/pdb-print.service$' <<<"$files"
            grep -q "Architecture: $a" <<<"$info"
            grep -q ' postinst' <<<"$info"
            grep -qx 'getent group bluetooth >/dev/null || groupadd --system bluetooth' <<<"$(dpkg-deb -I "$deb" postinst)"
            grep -qx 'SupplementaryGroups=lp bluetooth dialout' <<<"$(dpkg-deb --fsys-tarfile "$deb" | tar -xO ./usr/lib/systemd/system/pdb-print.service)"
          done
          if compgen -G 'dist/*darwin*' >/dev/null; then exit 1; fi # macOS is built by packaging-darwin
          grep -q 'Depends: init-system-helpers, poppler-utils' <<<"$(dpkg-deb -I dist/pdb-print_*_armhf.deb)"
          grep -q 'Depends: init-system-helpers$' <<<"$(dpkg-deb -I dist/pdb-print_*_arm64.deb)"
          if compgen -G 'dist/*windows*' >/dev/null; then exit 1; fi # Windows is built by packaging-windows
          if grep -q try-printer <<<"$(tar tzf dist/pdb-print_*_linux_amd64.tar.gz)"; then exit 1; fi

  # the Windows release half (.goreleaser-windows.yaml plus setup.exe), as release.yml's release-windows
  # job runs it
  packaging-windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04 # as release-windows: setup.exe builds with the image's Wine
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: build packages
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.3
          args: release --snapshot --clean --skip=publish --config .goreleaser-windows.yaml
      # Wine's debs come from Ubuntu's mirror, which is sometimes very slow; keep them in the Actions cache.
      # Caches saved on main are visible to every PR, so pushes to main keep it filled.
      - id: image
        run: echo "version=$ImageOS-$ImageVersion" >>"$GITHUB_OUTPUT"
      - id: debs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/wine-debs
          key: wine-debs-${{ steps.image.outputs.version }}-${{ github.run_id }}
          restore-keys: |
            wine-debs-${{ steps.image.outputs.version }}-
            wine-debs-
      - id: wine
        name: install Wine
        timeout-minutes: 10 # without cached debs a slow mirror can take minutes; fail rather than hang
        run: |
          mkdir -p ~/wine-debs/partial
          before=$(find ~/wine-debs -name '*.deb' | wc -l)
          sudo dpkg --add-architecture i386
          # the runner's regional mirror was down to 30-60 KB/s (2026-11-24); Ubuntu's Azure CDN mirror instead
          sudo sed -i -E 's#https?://[a-z0-9.-]*archive\.ubuntu\.com/ubuntu/?#http://azure.archive.ubuntu.com/ubuntu/#' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Dir::Cache::Archives="$HOME/wine-debs" \
            install -y --no-install-recommends wine wine64 wine32:i386 xvfb
          [ "$(find ~/wine-debs -name '*.deb' | wc -l)" = "$before" ] || echo downloaded=true >>"$GITHUB_OUTPUT"
      # also after a timeout: the debs downloaded so far make the next run faster
      - if: always() && steps.image.outcome == 'success'
        run: sudo rm -rf ~/wine-debs/partial ~/wine-debs/lock && sudo chown -R "$USER" ~/wine-debs
      - if: always() && steps.image.outcome == 'success' && (steps.wine.outcome != 'success' || steps.wine.outputs.downloaded == 'true')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/wine-debs
          key: ${{ steps.debs.outputs.cache-primary-key }}
      - name: build setup.exe
        run: scripts/windows-setup.sh
      - name: check packages
        run: |
          zip=$(unzip -l dist/pdb-print_*_windows_amd64.zip)
          for f in pdb-print.exe pdb-printw.exe try-printer.cmd TRY.md; do grep -q " $f$" <<<"$zip"; done
          setup=$(ls dist/pdb-print_*_windows_amd64_setup.exe)
          [ "$(grep -c . dist/checksums-windows.txt)" = 2 ]
          (cd dist && sha256sum -c checksums-windows.txt)
          file "$setup" | grep -q 'PE32 .*MS Windows'
      # to try a PR's setup.exe on a Windows machine
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-setup
          path: dist/pdb-print_*_windows_amd64_setup.exe
          retention-days: 7

  # the macOS release half (.goreleaser-darwin.yaml), as release.yml's release-darwin job runs it
  packaging-darwin:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: build packages
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.3
          args: release --snapshot --clean --skip=publish --config .goreleaser-darwin.yaml
      - name: check packages
        run: |
          ble=dist/pdb-print-ble-universal_darwin_all/pdb-print-ble
          pp=dist/pdb-print-universal_darwin_all/pdb-print
          for a in x86_64 arm64; do lipo "$pp" -verify_arch "$a"; done
          mods=$(go version -m "$pp")
          grep -q 'CGO_ENABLED=0' <<<"$mods"
          if grep -q tinygo.org/x/bluetooth <<<"$mods"; then exit 1; fi
          grep -q 'CGO_ENABLED=1' <<<"$(go version -m "$ble")"
          for a in x86_64 arm64; do
            lipo "$ble" -thin "$a" -output "$RUNNER_TEMP/ble-$a"
            grep -q '__info_plist' <<<"$(otool -s __TEXT __info_plist "$RUNNER_TEMP/ble-$a")"
          done
          grep -q NSBluetoothAlwaysUsageDescription <<<"$(launchctl plist "$ble")"
          # without the release secrets scripts/macos-sign.sh signs ad hoc, with the hardened runtime
          for b in "$pp" "$ble"; do
            codesign --verify --strict "$b"
            grep -q 'flags=.*runtime' <<<"$(codesign -dv "$b" 2>&1)"
          done
          grep -q "Info.plist entries=" <<<"$(codesign -dvvv "$ble" 2>&1)" # the embedded Info.plist is sealed
          files=$(tar tzf dist/pdb-print_*_darwin_universal.tar.gz)
          grep -qx pdb-print <<<"$files"
          grep -qx pdb-print-ble <<<"$files"
          grep -q ' pdb-print_.*_darwin_universal.tar.gz$' dist/checksums-darwin.txt
          grep -q 'binary "pdb-print-ble"' dist/homebrew/Casks/pdb-print.rb

  # the one required status check: fails if any job above failed or was cancelled (skipped is fine)
  ci:
    if: always()
    needs: [changes, test, coverage, lint, packaging, packaging-windows, packaging-darwin]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          ! grep -qE 'failure|cancelled' <<<"$RESULTS"
