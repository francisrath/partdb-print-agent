name: Release

# Push a tag like v0.1.0 to build and publish: GitHub release with archives and
# checksums, multi-arch image on ghcr.io, and the Homebrew cask in francisrath/homebrew-tap.
# release (Linux) makes a draft release with everything but Windows and macOS; release-windows
# adds the Windows zip and setup.exe; release-darwin (after both) adds the macOS archive (it needs
# cgo for the Bluetooth helper) and pushes the cask, then its last step publishes the draft once it
# carries every archive, so a failed Windows or macOS build leaves a draft, never a half release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release
  packages: write # push the image to ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # changelog needs the history
          persist-credentials: false # GoReleaser uses GITHUB_TOKEN; don't leave git credentials behind
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false # this job publishes: don't restore a cache another run wrote
      - run: go test ./...
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-windows:
    needs: release
    runs-on: ubuntu-latest # setup.exe: Inno Setup under Wine in Docker (scripts/windows-setup.sh)
    permissions:
      contents: write # add to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser reads the tags
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false # this job publishes: don't restore a cache another run wrote
      # Without a draft GoReleaser would create a Windows-only release
      - name: require the Linux job's draft
        run: |
          if [ "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != true ]; then
            echo "::error::no draft release for $GITHUB_REF_NAME; the release job makes it (docs/releasing.md)"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.3
          args: release --clean --config .goreleaser-windows.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: build setup.exe
        run: scripts/windows-setup.sh
      # the checksums file GoReleaser uploaded lacks setup.exe: replace it
      - name: upload setup.exe
        run: |
          cd dist
          sha256sum -c checksums-windows.txt
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            pdb-print_*_windows_amd64_setup.exe checksums-windows.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-darwin:
    needs: [release, release-windows] # it publishes: only once the Windows assets are there
    runs-on: macos-latest
    permissions:
      contents: write # add to and publish the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser reads the tags
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false # this job publishes: don't restore a cache another run wrote
      # GoReleaser only looks for a draft (use_existing_draft); on a re-run after it already
      # published (e.g. the cask push failed), turn the release back into a draft so it's found
      # instead of a second release being made
      - name: re-run - turn the published release back into a draft
        run: |
          if draft=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>"$RUNNER_TEMP/gh-err"); then
            if [ "$draft" = false ]; then
              gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=true
            fi
          elif ! grep -q "release not found" "$RUNNER_TEMP/gh-err"; then # only "no release" is left to the next step
            cat "$RUNNER_TEMP/gh-err" >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Without a draft GoReleaser would create and publish a macOS-only release
      - name: require the Linux job's draft
        run: |
          if [ "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != true ]; then
            echo "::error::no draft release for $GITHUB_REF_NAME; the release job makes it"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The Developer ID certificate goes into a throwaway keychain and the notary key into a file;
      # scripts/macos-sign.sh (a GoReleaser hook) signs and notarises with them before the archive is
      # made. Missing secrets fail the job: a release is never unsigned (docs/releasing.md).
      - name: set up signing
        run: |
          for v in MACOS_SIGN_P12 MACOS_SIGN_PASSWORD MACOS_NOTARY_KEY; do
            if [ -z "${!v}" ]; then echo "::error::secret $v is not set (docs/releasing.md)"; exit 1; fi
          done
          kc=$RUNNER_TEMP/signing.keychain-db
          kp=$(openssl rand -hex 24)
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kp" "$kc"
          base64 --decode <<<"$MACOS_SIGN_P12" >"$RUNNER_TEMP/sign.p12"
          security import "$RUNNER_TEMP/sign.p12" -k "$kc" -P "$MACOS_SIGN_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/sign.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kp" "$kc" >/dev/null
          # On a runner codesign finds no identity in a keychain off the user's search list, even with
          # --keychain (v0.3.0: "no identity found")
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          id=$(security find-identity -v -p codesigning "$kc" | awk '/"Developer ID Application: / {print $2; exit}')
          if [ -z "$id" ]; then echo "::error::no Developer ID Application identity in MACOS_SIGN_P12"; exit 1; fi
          (umask 077; printf '%s\n' "$MACOS_NOTARY_KEY" >"$RUNNER_TEMP/notary.p8")
          { echo "MACOS_SIGN_KEYCHAIN=$kc"; echo "MACOS_SIGN_IDENTITY=$id"; echo "MACOS_NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8"; } >>"$GITHUB_ENV"
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.3
          args: release --clean --config .goreleaser-darwin.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # fine-grained token with Contents: read/write on francisrath/homebrew-tap only
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      - name: remove the signing keychain and notary key
        if: always()
        run: |
          if [ -n "${MACOS_SIGN_KEYCHAIN:-}" ]; then security delete-keychain "$MACOS_SIGN_KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/notary.p8"
      # What gets published must be Developer-ID signed and notarised, whatever the hook did
      - name: check the macOS archive is signed and notarised
        run: |
          mkdir "$RUNNER_TEMP/check"
          tar xzf dist/pdb-print_*_darwin_universal.tar.gz -C "$RUNNER_TEMP/check"
          for b in pdb-print pdb-print-ble; do
            codesign --verify --strict "$RUNNER_TEMP/check/$b"
            spctl --assess --type install "$RUNNER_TEMP/check/$b"
          done
      # The only release for the tag must be a draft with every archive; then publish it. The cask
      # pushed by GoReleaser points at it from here on.
      - name: publish the draft
        run: |
          rels=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | \"\(.id) \(.draft)\"")
          if [ "$(grep -c . <<<"$rels")" != 1 ]; then
            echo "::error::$(grep -c . <<<"$rels") releases for $GITHUB_REF_NAME (want one draft); delete the extra draft (docs/releasing.md)"
            exit 1
          fi
          read -r id draft <<<"$rels"
          if [ "$draft" != true ]; then
            echo "::error::the release for $GITHUB_REF_NAME is not a draft"
            exit 1
          fi
          assets=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$id/assets" --jq '.[].name')
          v=${GITHUB_REF_NAME#v}
          for a in checksums.txt checksums-darwin.txt checksums-windows.txt "pdb-print_${v}_darwin_universal.tar.gz" \
            "pdb-print_${v}_linux_amd64.tar.gz" "pdb-print_${v}_linux_arm64.tar.gz" \
            "pdb-print_${v}_linux_armv6.tar.gz" "pdb-print_${v}_windows_amd64.zip" \
            "pdb-print_${v}_windows_amd64_setup.exe"; do
            if ! grep -qxF "$a" <<<"$assets"; then
              echo "::error::draft $GITHUB_REF_NAME lacks $a; not publishing"
              exit 1
            fi
          done
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
